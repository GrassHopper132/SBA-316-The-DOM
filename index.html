<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DOM</title>
    <link src="stylesheet" href="./styles.css">
    <script src="./index.js" defer></script>
</head>
    
<body>

  <header>
    <h1 id="main-title">Classified Armory Data</h1> 
    <!----- BOM Data goes here -----> 
    <p id="system-info"></p>
  </header>
  <!--------- why all of a sudden // this dont work----->
  <main>
    
    <template id="gun-template">
      <div class="gun-card">
        <h2 class="gun-name"></h2>
        
        <img class="gun-image" src="" alt="Weapon Image">
        <p class="gun-desc"></p>
      </div>
    </template>

    <!----The 6x3 Grid Container ------> 
    <section id="armory-grid" class="grid-container"></section>

    <hr>

    <!---Form Validation Section -->
    <section id="clearance-section">
      <h2>Request Level 4 Clearance</h2>
      <form id="clearance-form">
        
        <label for="callsign">Operative Callsign:</label>
        <input type="text" id="callsign" required minlength="4" placeholder="Min 4 characters">
        <span id="error-message" class="error"></span>
        <button type="submit">Submit Request</button>
      </form>
    </section>
  </main>


</body>
</html>
